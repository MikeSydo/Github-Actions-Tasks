name: CI

on:
  pull_request:
    branches: ["develop"]

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: |
          python -m pytest --cov=myapp --cov-report=term-missing 2>&1 | tee test_reports.txt

      - name: Check coverage report
        run: |
          coverage_percent=$(awk '/^TOTAL/ {gsub("%", "", $NF); print $NF}' test_reports.txt)
          if [ -z "$coverage_percent" ]; then
            echo "Could not find coverage total in test_reports.txt"
            exit 1
          fi

          if [ "$coverage_percent" -lt 70 ]; then
            echo "Coverage ${coverage_percent}% is below 70%"
            exit 1
          fi

          echo "Coverage ${coverage_percent}% meets the threshold"

  build:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: ${{ github.head_ref }}

      - name: Update README badge
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          badge='[![CI](https://github.com/'"$REPOSITORY"'/actions/workflows/CI.yml/badge.svg?branch=develop)](https://github.com/'"$REPOSITORY"'/actions/workflows/CI.yml)'

          if [ -f README.md ] && grep -q 'actions/workflows/CI.yml/badge.svg' README.md; then
            echo "README already contains the workflow badge"
            exit 0
          fi

          if [ -f README.md ]; then
            printf '%s\n\n' "$badge" | cat - README.md > README.md.tmp
            mv README.md.tmp README.md
          else
            printf '# Github Actions Tasks\n\n%s\n' "$badge" > README.md
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "Update README badge" || exit 0
          git push
