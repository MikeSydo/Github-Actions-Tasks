name: CI

on:
  push:
    branches: ["develop"]
  pull_request:
    branches: ["develop"]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: |
          python -m pytest --cov=myapp --cov-report=term-missing 2>&1 | tee test_reports.txt

      - name: Check coverage report
        run: |
          coverage_percent=$(awk '/^TOTAL/ {gsub("%", "", $NF); print $NF}' test_reports.txt)
          if [ -z "$coverage_percent" ]; then
            echo "Could not find coverage total in test_reports.txt"
            exit 1
          fi

          if [ "$coverage_percent" -lt 70 ]; then
            echo "Coverage ${coverage_percent}% is below 70%"
            exit 1
          fi

          echo "Coverage ${coverage_percent}% meets the threshold"
